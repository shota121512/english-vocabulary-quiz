<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語クイズ</title><style>body{font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;max-width:850px;margin:auto;padding:24px}button,input,textarea{font:inherit;padding:12px;border-radius:9px;border:1px solid #64748b}button{cursor:pointer;background:#334155;color:white;margin:5px}button:hover{background:#475569}.panel{background:#1e293b;padding:22px;border-radius:16px;margin:16px 0}.choices{display:grid;grid-template-columns:1fr 1fr}.good{background:#166534!important}.bad{background:#991b1b!important}input{width:90%;margin:5px;background:#fff;color:#111}small{color:#cbd5e1}#word{font-size:42px;font-weight:bold}#feedback{line-height:1.8}a{color:#93c5fd}@media(max-width:550px){.choices{grid-template-columns:1fr}}</style><h1>📚 英単語イメージクイズ</h1><small id="count"></small><div><button onclick="setMode('all')">全単語</button><button onclick="setMode('wrong')">苦手単語</button><button onclick="setMode('custom')">追加した単語</button></div><section class="panel"><small id="progress"></small><div id="word"></div><div id="choices" class="choices"></div><div id="feedback"></div><button onclick="next()">次の問題 →</button></section><section class="panel"><h2>＋ 単語を追加</h2><input id="en" placeholder="英単語"><input id="ja" placeholder="日本語の意味"><input id="ex" placeholder="英語の例文"><button onclick="add()">単語を保存</button><p id="notice"></p><button onclick="backup()">単語データをバックアップ</button><input type="file" accept=".json" onchange="restore(event)"><small>追加した単語と苦手単語は、このブラウザに保存されます。別端末ではバックアップを読み込んでください。</small></section><script>const starter=[["struggle","苦労する","I struggle to wake up early."],["bother","困らせる","Sorry to bother you."],["offer","申し出る","Can I offer you a hand?"],["encourage","励ます","My friend encouraged me."],["realize","気づく","I realized my mistake."],["complain","不満を言う","Don't complain about everything."],["pretend","ふりをする","He pretended to be asleep."],["deserve","値する","You deserve a break."],["imagine","想像する","Imagine living abroad."],["appreciate","感謝する","I appreciate your help."],["maintain","維持する","Maintain a healthy routine."],["develop","発展させる","I want to develop my skills."],["improve","改善する","My English is improving."],["depend","頼る","It depends on the weather."],["require","必要とする","This job requires experience."],["succeed","成功する","You can succeed."],["fail","失敗する","I failed the test."],["achieve","達成する","I achieved my goal."],["consider","検討する","I'll consider your offer."],["recommend","勧める","I recommend this cafe."],["accept","受け入れる","I accepted the offer."],["avoid","避ける","Avoid making the same mistake."],["allow","許す","They allow pets here."],["appear","現れる","A rainbow appeared."],["apply","応募する","I will apply for the job."],["arrange","手配する","I'll arrange a meeting."],["attend","出席する","I attended the class."],["belong","所属する","This bag belongs to me."],["borrow","借りる","Can I borrow your pen?"],["compare","比較する","Compare the two options."],["confirm","確認する","Please confirm the booking."],["connect","つなぐ","Connect to the Wi-Fi."],["contain","含む","This soup contains milk."],["continue","続ける","Keep going and continue learning."],["convince","納得させる","She convinced me to try."],["create","作る","Let's create a new plan."],["decide","決める","I decided to move."],["deliver","配達する","I deliver food."],["describe","説明する","Describe your hometown."],["discover","発見する","I discovered a nice park."],["discuss","話し合う","Let's discuss the plan."],["divide","分ける","Divide the cake into four."],["earn","稼ぐ","I want to earn more money."],["expect","予想する","I expect it to rain."],["explain","説明する","Can you explain this?"],["explore","探検する","I want to explore the city."],["express","表現する","Express your opinion."],["focus","集中する","Focus on one thing."],["gather","集める","We gathered information."],["handle","対処する","I can handle this task."],["identify","特定する","Can you identify the problem?"],["include","含める","The price includes breakfast."],["increase","増える","Prices continue to increase."],["influence","影響する","Friends influence each other."],["introduce","紹介する","Let me introduce myself."],["invite","招待する","I'll invite my friend."],["involve","伴う","The job involves travel."],["manage","管理する","I manage my time."],["mention","言及する","She mentioned your name."],["notice","気づく","I noticed a small change."],["obtain","手に入れる","You need to obtain a visa."],["occur","起こる","Accidents can occur."],["organize","整理する","I organize my notes."],["participate","参加する","I want to participate."],["perform","実行する","She performed well."],["persuade","説得する","He persuaded me to join."],["prepare","準備する","I prepared for the interview."],["prevent","防ぐ","Exercise can prevent problems."],["produce","生産する","The factory produces cars."],["protect","守る","Protect your belongings."],["provide","提供する","We provide free Wi-Fi."],["receive","受け取る","I received your message."],["recognize","見分ける","I recognize that face."],["reduce","減らす","I want to reduce waste."],["refuse","断る","She refused the offer."],["remain","残る","Only two seats remain."],["remind","思い出させる","Please remind me tomorrow."],["remove","取り除く","Remove your shoes here."],["replace","取り替える","We replaced the battery."],["respond","返答する","Please respond soon."],["result","結果になる","Hard work results in progress."],["save","節約する","I'm saving money."],["select","選ぶ","Select your answer."],["separate","分ける","Separate the rubbish."],["share","共有する","Let's share our ideas."],["solve","解決する","We solved the problem."],["suggest","提案する","Can you suggest a place?"],["support","支える","My friends support me."],["suppose","思う","I suppose you're right."],["survive","生き延びる","They survived the storm."],["tend","傾向がある","I tend to wake up late."],["transfer","乗り換える","Transfer at the next station."],["translate","翻訳する","Translate this sentence."],["treat","扱う","Treat people with respect."],["trust","信頼する","I trust my friend."],["understand","理解する","I understand the question."],["volunteer","ボランティアをする","I volunteer on weekends."],["wonder","疑問に思う","I wonder what happened."],["adapt","適応する","I am adapting to a new country."],["worry","心配する","Don't worry about it."]];let extra=JSON.parse(localStorage.getItem('quiz_extra')||'[]'),wrong=JSON.parse(localStorage.getItem('quiz_wrong')||'[]'),mode='all',pool=[],i=0,answered=false;function words(){return [...starter,...extra]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function setMode(m){mode=m;pool=shuffle(words().filter(w=>m==='all'||m==='custom'&&extra.some(e=>e[0]===w[0])||m==='wrong'&&wrong.includes(w[0])));i=0;render()}function render(){document.getElementById('count').textContent=words().length+'単語収録';document.getElementById('progress').textContent=pool.length?((i%pool.length)+1)+' / '+pool.length:'問題がありません';let w=pool[i%pool.length];document.getElementById('word').textContent=w?w[0]:'単語を追加してね';document.getElementById('feedback').textContent='';let box=document.getElementById('choices');box.innerHTML='';answered=false;if(!w)return;let distractors=shuffle(words().filter(x=>x[1]!==w[1]&&x[0]!==w[0])).slice(0,3);shuffle([w,...distractors]).forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.onclick=()=>{if(answered)return;answered=true;let ok=x[0]===w[0];b.className=ok?'good':'bad';if(!ok&&!wrong.includes(w[0]))wrong.push(w[0]);if(ok)wrong=wrong.filter(z=>z!==w[0]);localStorage.setItem('quiz_wrong',JSON.stringify(wrong));document.getElementById('feedback').textContent=(ok?'正解！':'不正解。正解：'+w[1])+'　'+w[2]};box.appendChild(b)})}function next(){if(pool.length){i=(i+1)%pool.length;render()}}function add(){let w=[en.value.trim(),ja.value.trim(),ex.value.trim()];if(w.some(x=>!x)){notice.textContent='3つとも入力してね';return}if(words().some(x=>x[0].toLowerCase()===w[0].toLowerCase())){notice.textContent='同じ英単語がすでにあります';return}extra.push(w);localStorage.setItem('quiz_extra',JSON.stringify(extra));en.value=ja.value=ex.value='';notice.textContent='保存しました！';setMode('custom')}function backup(){let blob=new Blob([JSON.stringify({extra,wrong},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='english-quiz-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.extra))throw Error();extra=d.extra.filter(w=>Array.isArray(w)&&w.length===3);wrong=Array.isArray(d.wrong)?d.wrong:[];localStorage.setItem('quiz_extra',JSON.stringify(extra));localStorage.setItem('quiz_wrong',JSON.stringify(wrong));notice.textContent='復元しました';setMode('all')}catch(e){notice.textContent='バックアップを読み込めませんでした'}};r.readAsText(f)}setMode('all');</script></html>
