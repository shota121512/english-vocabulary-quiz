<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語クイズ</title><style>body{font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;max-width:1450px;margin:auto;padding:24px}button,input,textarea{font:inherit;padding:12px;border-radius:9px;border:1px solid #64748b}button{cursor:pointer;background:#334155;color:white;margin:5px}button:hover{background:#475569}.panel{background:#1e293b;padding:22px;border-radius:16px;margin:16px 0}.choices{display:grid;grid-template-columns:1fr 1fr}.good{background:#166534!important}.bad{background:#991b1b!important}input{width:90%;margin:5px;background:#fff;color:#111}small{color:#cbd5e1}#word{font-size:42px;font-weight:bold}#feedback{line-height:1.8}a{color:#93c5fd}@media(max-width:550px){.choices{grid-template-columns:1fr}} .layout{display:grid;grid-template-columns:minmax(320px,0.85fr) minmax(520px,1.6fr);gap:18px;align-items:start}.photo-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.photo-card{overflow:hidden;background:#334155;border-radius:10px;position:relative;min-width:0}.photo-card img{width:100%;height:115px;object-fit:cover;display:block;background:#475569}.photo-card .photo-label{font-size:12px;text-align:center;padding:6px 2px;overflow-wrap:anywhere}.photo-card .placeholder{display:none;height:115px;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(135deg,#475569,#1e293b)}.photo-card.fallback img{display:none}.photo-card.fallback .placeholder{display:flex}.photo-card.active{outline:3px solid #38bdf8}.setbar{display:flex;align-items:center;justify-content:space-between;gap:4px}.setbar button{font-size:13px}.photohint{font-size:12px;color:#cbd5e1}@media(max-width:850px){.layout{grid-template-columns:1fr}.photo-card img,.photo-card .placeholder{height:90px}}@media(max-width:470px){.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-card img,.photo-card .placeholder{height:115px}}.illustration{height:180px;display:flex;align-items:center;justify-content:center;font-size:80px;background:linear-gradient(145deg,#3b526e,#243349)}@media(max-width:850px){.illustration{height:155px}}@media(max-width:470px){.illustration{height:150px}}.realphoto{background-repeat:no-repeat;background-color:#334155}.photo-card .illustration.realphoto{height:auto!important;aspect-ratio:1/1.05;background-repeat:no-repeat;background-color:#243349}.photo-card .photo-label{position:relative;z-index:1;background:#334155}@media(max-width:470px){.photo-card .illustration.realphoto{height:auto!important}}.illustration.gridphoto{height:auto!important;aspect-ratio:3/2;background-repeat:no-repeat;background-color:#263448}</style><h1>📚 英単語イメージクイズ</h1><small style="color:#93c5fd">更新版 2026-11-16 修復確認</small><small id="count"></small><div><button onclick="setMode('all')">全単語</button><button onclick="setMode('wrong')">苦手単語</button><button onclick="setMode('custom')">追加した単語</button></div><div class="layout"><section class="panel"><small id="progress"></small><div id="word"></div><div id="choices" class="choices"></div><div id="feedback"></div><button onclick="next()">次の問題 →</button></section><section class="panel"><div class="setbar"><button onclick="changeSet(-1)">← 前の10語</button><b id="setlabel"></b><button onclick="changeSet(1)">次の10語 →</button></div><p class="photohint">このセットの単語をイメージする写真・イラスト</p><div id="photos" class="photo-grid"></div></section></div><section class="panel"><h2>＋ 単語を追加</h2><input id="en" placeholder="英単語"><input id="ja" placeholder="日本語の意味"><input id="ex" placeholder="英語の例文"><button onclick="add()">単語を保存</button><p id="notice"></p><button onclick="backup()">単語データをバックアップ</button><input type="file" accept=".json" onchange="restore(event)"><small>追加した単語と苦手単語は、このブラウザに保存されます。別端末ではバックアップを読み込んでください。</small></section><script>const starter=[["struggle","苦労する","I struggle to wake up early."],["bother","困らせる","Sorry to bother you."],["offer","申し出る","Can I off ,"集中する","Focus on one thing."],["gather","集める","We gathered information."],["handle","対処する","I can handle this task."],["identify","特定する","Can you identify the problem?"],["include","含める","The price includes breakfast."],["increase","増える","Prices continue to increase."],["influence","影響する","Friends influence each other."],["introduce","紹介する","Let me introduce myself."],["invite","招待する","I'll invite my friend."],["involve","伴う","The job involves travel."],["manage","管理する","I manage my time."],["mention","言及する","She mentioned your name."],["notice","気づく","I noticed a small change."],["obtain","手に入れる","You need to obtain a visa."],["occur","起こる","Accidents can occur."],["organize","整理する","I organize my notes."],["participate","参加する","I want to participate."],["perform","実行する","She performed well."],["persuade","説得する","He persuaded me to join."],["prepare","準備する","I prepared for the interview."],["prevent","防ぐ","Exercise can prevent problems."],["produce","生産する","The factory produces cars."],["protect","守る","Protect your belongings."],["provide","提供する","We provide free Wi-Fi."],["receive","受け取る","I received your message."],["recognize","見分ける","I recognize that face."],["reduce","減らす","I want to reduce waste."],["refuse","断る","She refused the offer."],["remain","残る","Only two seats remain."],["remind","思い出させる","Please remind me tomorrow."],["remove","取り除く","Remove your shoes here."],["replace","取り替える","We replaced the battery."],["respond","返答する","Please respond soon."],["result","結果になる","Hard work results in progress."],["save","節約する","I'm saving money."],["select","選ぶ","Select your answer."],["separate","分ける","Separate the rubbish."],["share","共有する","Let's share our ideas."],["solve","解決する","We solved the problem."],["suggest","提案する","Can you suggest a place?"],["support","支える","My friends support me."],["suppose","思う","I suppose you're right."],["survive","生き延びる","They survived the storm."],["tend","傾向がある","I tend to wake up late."],["transfer","乗り換える","Transfer at the next station."],["translate","翻訳する","Translate this sentence."],["treat","扱う","Treat people with respect."],["trust","信頼する","I trust my friend."],["understand","理解する","I understand the question."],["volunteer","ボランティアをする","I volunteer on weekends."],["wonder","疑問に思う","I wonder what happened."],["adapt","適応する","I am adapting to a new country."],["worry","心配する","Don't worry about it."]];let extra=JSON.parse(localStorage.getItem('quiz_extra')||'[]'),wrong=JSON.parse(localStorage.getItem('quiz_wrong')||'[]'),mode='all',pool=[],i=0,answered=false,setIndex=0;function words(){return [...starter,...extra]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function setMode(m){mode=m;pool=words().filter(w=>m==='all'||m==='custom'&&extra.some(e=>e[0]===w[0])||m==='wrong'&&wrong.includes(w[0]));if(m==='all'){let first=['maintain','occur','invite','compare','create','protect','focus','discover','separate','appreciate'];pool.sort((a,b)=>{let ai=first.indexOf(a[0]),bi=first.indexOf(b[0]);return (ai<0?999:ai)-(bi<0?999:bi)})}i=0;setIndex=0;render()}function render(){document.getElementById('count').textContent=words().length+'単語収録';document.getElementById('progress').textContent=pool.length?((setIndex*10+i%10)+1)+' / '+pool.length:'問題がありません';let setCount=Math.max(1,Math.ceil(pool.length/10));setIndex=Math.min(setIndex,setCount-1);let setWords=pool.slice(setIndex*10,setIndex*10+10);let w=setWords[i%Math.max(1,setWords.length)];document.getElementById('word').textContent=w?w[0]:'単語を追加してね';document.getElementById('feedback').textContent='';let box=document.getElementById('choices');box.innerHTML='';answered=false;drawPhotos(setWords,w);if(!w)return;let distractors=shuffle(words().filter(x=>x[1]!==w[1]&&x[0]!==w[0])).slice(0,3);shuffle([w,...distractors]).forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.onclick=()=>{if(answered)return;answered=true;let ok=x[0]===w[0];b.className=ok?'good':'bad';if(!ok&&!wrong.includes(w[0]))wrong.push(w[0]);if(ok)wrong=wrong.filter(z=>z!==w[0]);localStorage.setItem('quiz_wrong',JSON.stringify(wrong));document.getElementById('feedback').textContent=(ok?'正解！':'不正解。正解：'+w[1])+'　'+w[2]};box.appendChild(b)})}function next(){if(pool.length){i++;if(i>=Math.min(10,pool.length-setIndex*10)){i=0;setIndex=(setIndex+1)%Math.ceil(pool.length/10)}render()}}function changeSet(d){if(!pool.length)return;setIndex=(setIndex+d+Math.ceil(pool.length/10))%Math.ceil(pool.length/10);i=0;render()}const photoIndex={'maintain':0,'occur':1,'invite':2,'compare':3,'create':4,'protect':5,'focus':6,'discover':7,'separate':8,'appreciate':9,'struggle':10,'bother':11,'offer':12,'encourage':13,'realize':14,'complain':15,'pretend':16,'deserve':17,'imagine':18,'develop':19,'achieve':20,'respond':21,'explain':22,'solve':23,'expand':24,'reduce':25,'cover':26,'include':27,'exclude':28,'affect':29,'assume':30,'estimate':31,'confirm':32,'depend':33,'reflect':34,'represent':35,'justify':36,'argue':37,'admit':38,'deny':39,'predict':40,'cause':41,'prevent':42,'project':43,'contribute':44,'influence':45,'challenge':46,'risk':47,'succeed':48,'fail':49,'improve':50,'replace':51,'manage':52,'organize':53,'arrange':54,'plan':55,'prepare':56,'provide':57,'obtain':58,'require':59,'continue':60,'stop':61,'start':62,'change':63,'remain':64,'disappear':65,'appear':66,'lack':67,'contain':68,'involve':69,'occur':70,'lead':71,'follow':72,'build':73,'design':74,'produce':75,'consume':76,'waste':77,'save':78,'invest':79,'earn':80,'spend':81,'borrow':82,'lend':83,'charge':84,'cost':85,'afford':86,'value':87,'worth':88,'price':89,'daily':90,'recent':91,'current':92,'future':93,'past':94,'previous':95,'various':96,'certain':97,'possible':98,'difficult':99};function drawPhotos(setWords,current){document.getElementById('setlabel').textContent='セット '+(setIndex+1)+' / '+Math.max(1,Math.ceil(pool.length/10));let area=document.getElementById('photos');area.innerHTML='';let symbols=['🌱','💡','🤝','🎯','🏆','🧠','🌍','📈','🛠️','✨','💬','🧩','💪','📚','🧭','🎁',' on.style.backgroundImage='url("assets/vocabulary_photos_100.png")';icon.style.backgroundSize='1000% 1250%';icon.style.backgroundPosition=((p%10)*100/9)+'% '+(Math.floor(p/10)*100/9)+'%';}else{icon.textContent=known[w[0]]||symbols[(setIndex*10+j)%symbols.length]}icon.setAttribute('role','img');icon.setAttribute('aria-label',w[0]+' のイメージイラスト');let label=document.createElement('div');label.className='photo-label';label.textContent=w[0];card.append(icon,label);area.appendChild(card)})}function add(){let w=[en.value.trim(),ja.value.trim(),ex.value.trim()];if(w.some(x=>!x)){notice.textContent='3つとも入力してね';return}if(words().some(x=>x[0].toLowerCase()===w[0].toLowerCase())){notice.textContent='同じ英単語がすでにあります';return}extra.push(w);localStorage.setItem('quiz_extra',JSON.stringify(extra));en.value=ja.value=ex.value='';notice.textContent='保存しました！';setMode('custom')}function backup(){let blob=new Blob([JSON.stringify({extra,wrong},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='english-quiz-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.extra))throw Error();extra=d.extra.filter(w=>Array.isArray(w)&&w.length===3);wrong=Array.isArray(d.wrong)?d.wrong:[];localStorage.setItem('quiz_extra',JSON.stringify(extra));localStorage.setItem('quiz_wrong',JSON.stringify(wrong));notice.textContent='復元しました';setMode('all')}catch(e){notice.textContent='バックアップを読み込めませんでした'}};r.readAsText(f)}try{setMode('all')}catch(e){document.getElementById("word").textContent="読み込みエラー: "+e.message;console.error(e)}</script></html>
